[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-journal"
version = "0.2.0"
description = "ADK-Python Daily Journaling Agent on Google Cloud (Iteration 2 Rubric-Aligned)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0.0",
    "google-cloud-dlp>=3.18.0",
    "google-cloud-firestore>=2.16.0",
    "google-cloud-secret-manager>=2.20.0",
    "google-cloud-storage>=2.16.0",
    "google-genai>=1.0.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-exporter-gcp-trace>=1.7.0",
    "opentelemetry-sdk>=1.25.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["journal_agent"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
